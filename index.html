<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beuna POS - Frontend Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <nav class="bg-green-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Beuna POS Tester</h1>
            <div class="space-x-4">
                <button onclick="switchTab('kasir')" class="hover:text-green-200 font-semibold">1. Kasir</button>
                <button onclick="switchTab('status')" class="hover:text-green-200 font-semibold">2. Update Status</button>
                <button onclick="switchTab('expense')" class="hover:text-green-200 font-semibold">3. Pengeluaran</button>
                <button onclick="switchTab('report')" class="hover:text-green-200 font-semibold">4. Laporan</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-8 p-4">
        
        <div id="tab-kasir" class="tab-content bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-4 text-green-700">Test Rute: CREATE ORDER</h2>
            <form id="form-order" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="custName" placeholder="Nama Pelanggan" required class="p-2 border rounded outline-none focus:ring-2 focus:ring-green-400">
                    <input type="text" id="custWA" placeholder="No WA (Cth: 628...)" required class="p-2 border rounded outline-none focus:ring-2 focus:ring-green-400">
                </div>
                
                <div class="flex space-x-2">
                    <select id="serviceSelect" class="flex-1 p-2 border rounded bg-gray-50 outline-none">
                        <option value="">Loading services dari n8n...</option>
                    </select>
                    <button type="button" onclick="addItem()" class="bg-blue-500 text-white px-4 rounded font-bold hover:bg-blue-600">+</button>
                </div>

                <div id="cart" class="p-4 bg-gray-50 border rounded min-h-[100px] space-y-2">
                    </div>

                <div class="grid grid-cols-2 gap-4 bg-green-50 p-4 rounded">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Grand Total</label>
                        <p class="text-2xl font-bold text-green-600">Rp <span id="grandTotal">0</span></p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Status Pembayaran</label>
                        <select id="payStatus" class="w-full p-2 border rounded mt-1">
                            <option value="BELUM BAYAR">Belum Bayar</option>
                            <option value="DP">DP</option>
                            <option value="LUNAS">Lunas</option>
                        </select>
                        <input type="number" id="payAmount" placeholder="Jumlah DP (jika DP)" class="w-full p-2 border rounded mt-2 hidden">
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700">KIRIM CREATE ORDER</button>
            </form>
        </div>

        <div id="tab-status" class="tab-content hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-4 text-blue-700">Test Rute: UPDATE STATUS</h2>
            <form id="form-status" class="space-y-4">
                <input type="text" id="updOrderId" placeholder="Masukkan Order ID (Contoh: FORTUNA-123A)" required class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-blue-400">
                <select id="updNewStatus" class="w-full p-2 border rounded outline-none">
                    <option value="PROSES">PROSES</option>
                    <option value="SELESAI">SELESAI</option>
                    <option value="DIAMBIL">DIAMBIL</option>
                    <option value="BATAL">BATAL</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700">KIRIM UPDATE STATUS</button>
            </form>
        </div>

        <div id="tab-expense" class="tab-content hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-4 text-red-700">Test Rute: ADD EXPENSE</h2>
            <form id="form-expense" class="space-y-4">
                <input type="date" id="expDate" required class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-red-400">
                <select id="expCategory" class="w-full p-2 border rounded outline-none">
                    <option value="Bahan Baku">Bahan Baku (Deterjen, Parfum)</option>
                    <option value="Operasional">Operasional (Listrik, Air)</option>
                    <option value="Gaji">Gaji Karyawan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
                <input type="number" id="expNominal" placeholder="Nominal (Rp)" required class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-red-400">
                <input type="text" id="expDesc" placeholder="Deskripsi Singkat" required class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-red-400">
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded hover:bg-red-700">KIRIM ADD EXPENSE</button>
            </form>
        </div>

        <div id="tab-report" class="tab-content hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-4 text-purple-700">Test Rute: GET REPORT</h2>
            <button onclick="fetchReport()" class="bg-purple-600 text-white font-bold py-2 px-4 rounded hover:bg-purple-700 mb-4">Tarik Data Log Order</button>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-2 px-4 border-b text-left">Order ID</th>
                            <th class="py-2 px-4 border-b text-left">Pelanggan</th>
                            <th class="py-2 px-4 border-b text-left">Total</th>
                            <th class="py-2 px-4 border-b text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr><td colspan="4" class="text-center py-4 text-gray-500">Klik tombol di atas untuk menarik data dari n8n</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // CONFIGURASI UTAMA
        // ==========================================
        const WEBHOOK_URL = 'https://URL_WEBHOOK_N8N_LU_DISINI/webhook/beuna-pos-api';
        const MERCHANT_ID = 'FORTUNA'; // Anggap aja kasir Fortuna yang lagi login
        const OUTLET_ID = 'FORTUNA-01';

        // ==========================================
        // UI LOGIC (TABS & CART)
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        let cartItems = [];
        let totalVal = 0;

        document.getElementById('payStatus').addEventListener('change', function() {
            const payInput = document.getElementById('payAmount');
            if (this.value === 'DP') {
                payInput.classList.remove('hidden');
                payInput.value = '';
            } else {
                payInput.classList.add('hidden');
                payInput.value = this.value === 'LUNAS' ? totalVal : 0;
            }
        });

        function renderCart() {
            const container = document.getElementById('cart');
            container.innerHTML = '';
            totalVal = 0;
            
            cartItems.forEach((item, index) => {
                totalVal += item.subtotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 border rounded">
                        <div>
                            <p class="font-bold text-sm">${item.service_name}</p>
                            <p class="text-xs text-gray-500">${item.qty_or_weight} x Rp ${item.price}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold">Rp ${item.subtotal}</span>
                            <button type="button" onclick="removeItem(${index})" class="text-red-500 font-bold px-2">X</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('grandTotal').innerText = totalVal.toLocaleString('id-ID');
            if(document.getElementById('payStatus').value === 'LUNAS') {
                document.getElementById('payAmount').value = totalVal;
            }
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            renderCart();
        }

        // ==========================================
        // N8N API CALLS (TESTING)
        // ==========================================
        
        // 1. GET SERVICES (Load otomatis pas awal)
        async function fetchServices() {
            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_services', merchant_id: MERCHANT_ID })
                });
                const data = await res.json();
                const select = document.getElementById('serviceSelect');
                select.innerHTML = '<option value="">Pilih Layanan...</option>';
                // Note: Struktur data n8n biasanya array of objects. 
                // Sesuaikan 'PRICE', 'NAME' dll dengan nama kolom tabel lu.
                if(Array.isArray(data)) {
                    data.forEach(s => {
                        // Kalau tabel belum diisi, gue kasih hardcode darurat buat testing cart-nya.
                        const price = s.PRICE || s.price || 5000;
                        const name = s.NAME || s.name || "Layanan Dummy";
                        const id = s.SERVICE_ID || s.id || "SRV-01";
                        const dur = s.DURATION_HOURS || s.duration_hours || 48;
                        select.innerHTML += `<option value="${id}|${name}|${price}|${dur}">${name} - Rp ${price}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Gagal meload tabel/Tabel kosong</option>';
                    // Hardcode darurat biar lu tetep bisa ngetest Create Order kalau Tabel Services belum ada isinya
                    select.innerHTML += `<option value="DUMMY|Cuci Reguler Test|6000|72">Cuci Reguler Test - Rp 6000</option>`;
                }
            } catch (err) {
                console.error("Gagal get services:", err);
                document.getElementById('serviceSelect').innerHTML = `<option value="DUMMY|Cuci Reguler Test|6000|72">Cuci Reguler Test - Rp 6000 (Mode Error CORS/Network)</option>`;
            }
        }

        function addItem() {
            const val = document.getElementById('serviceSelect').value;
            if(!val) return;
            const [id, name, price, dur] = val.split('|');
            cartItems.push({
                service_id: id, service_name: name, price: parseFloat(price),
                qty_or_weight: 1, duration_hours: parseInt(dur), subtotal: parseFloat(price)
            });
            renderCart();
        }

        // 2. CREATE ORDER
        document.getElementById('form-order').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(cartItems.length === 0) return alert('Keranjang kosong bree!');
            
            const btn = e.target.querySelector('button');
            btn.innerText = 'MEMPROSES...'; btn.disabled = true;

            let paidAmt = parseFloat(document.getElementById('payAmount').value) || 0;
            if(document.getElementById('payStatus').value === 'BELUM BAYAR') paidAmt = 0;

            const payload = {
                action: "create_order",
                merchant_id: MERCHANT_ID,
                outlet_id: OUTLET_ID,
                customer: { name: document.getElementById('custName').value, wa_number: document.getElementById('custWA').value.replace(/\D/g,'') },
                payment: { status: document.getElementById('payStatus').value, paid_amount: paidAmt, grand_total: totalVal },
                items: cartItems
            };

            try {
                const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                alert("N8N RESPONS: " + JSON.stringify(data));
                cartItems = []; renderCart(); e.target.reset();
            } catch (err) {
                alert("Error! Cek console / n8n lu."); console.error(err);
            } finally {
                btn.innerText = 'KIRIM CREATE ORDER'; btn.disabled = false;
            }
        });

        // 3. UPDATE STATUS
        document.getElementById('form-status').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = 'MEMPROSES...'; btn.disabled = true;

            const payload = {
                action: "update_status",
                order_id: document.getElementById('updOrderId').value,
                new_status: document.getElementById('updNewStatus').value
            };

            try {
                const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                alert("N8N RESPONS: " + JSON.stringify(data));
            } catch (err) {
                alert("Error!"); console.error(err);
            } finally {
                btn.innerText = 'KIRIM UPDATE STATUS'; btn.disabled = false;
            }
        });

        // 4. ADD EXPENSE
        document.getElementById('form-expense').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = 'MEMPROSES...'; btn.disabled = true;

            const payload = {
                action: "add_expense",
                merchant_id: MERCHANT_ID,
                outlet_id: OUTLET_ID,
                tanggal: document.getElementById('expDate').value,
                kategori: document.getElementById('expCategory').value,
                nominal: document.getElementById('expNominal').value,
                deskripsi: document.getElementById('expDesc').value
            };

            try {
                const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                alert("N8N RESPONS: " + JSON.stringify(data));
                e.target.reset();
            } catch (err) {
                alert("Error!"); console.error(err);
            } finally {
                btn.innerText = 'KIRIM ADD EXPENSE'; btn.disabled = false;
            }
        });

        // 5. GET REPORT
        async function fetchReport() {
            const btn = document.querySelector('#tab-report button'); btn.innerText = 'Menarik data...';
            const tbody = document.getElementById('reportTableBody');

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_report', merchant_id: MERCHANT_ID })
                });
                const data = await res.json();
                
                tbody.innerHTML = '';
                if(Array.isArray(data) && data.length > 0) {
                    data.forEach(order => {
                        // Sesuaikan ORDER_ID, CUSTOMER_ID dll sesuai format DB lu
                        const oid = order.ORDER_ID || order.order_id || '-';
                        const cust = order.CUSTOMER_ID || order.customer_id || '-';
                        const total = order.GRAND_TOTAL || order.grand_total || 0;
                        const status = order.STATUS || order.status || '-';
                        
                        tbody.innerHTML += `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="py-2 px-4">${oid}</td>
                                <td class="py-2 px-4">${cust}</td>
                                <td class="py-2 px-4">Rp ${total}</td>
                                <td class="py-2 px-4"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${status}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">Tabel Orders masih kosong atau error.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">Gagal menarik data dari n8n. Pastikan workflow aktif!</td></tr>';
                console.error(err);
            } finally {
                btn.innerText = 'Tarik Data Log Order';
            }
        }

        // Jalankan get services saat web pertama kali direfresh
        window.onload = fetchServices;
    </script>
</body>
</html>
